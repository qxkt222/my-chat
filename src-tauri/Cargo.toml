[package]
name = "my-chat"
version = "0.2.0"
edition = "2021"

[lints.rust]
# unsafe fn 内部必须显式 unsafe 块(encryption.rs DPAPI FFI 已满足)
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
# 健康度加固:pedantic 全开为 warn(priority -1 使下面具体规则可覆盖组);按项目实际过滤噪音
pedantic = { level = "warn", priority = -1 }
# 噪声过滤:命令层/组装的冗长函数是 Tauri 命令常态,不强制拆分
too_many_lines = "allow"
# 索引/数学的精度转换在业务代码可接受
cast_possible_truncation = "allow"
cast_lossless = "allow"
cast_sign_loss = "allow"
# 时间戳→秒/体积→MB 的 u64→f64 转换是有意为之
cast_precision_loss = "allow"
# 指针 usize→数字的包装转换在解析场景可接受
cast_possible_wrap = "allow"
# 模板字符串风格在命令层保持简洁
module_name_repetitions = "allow"
# 数字字面量可读性(业务阈值)
unreadable_literal = "allow"
# 单字符名在短回调/循环可读
many_single_char_names = "allow"
# 文档注释要求对内部函数过严
missing_panics_doc = "allow"
# Tauri 命令参数按值传递是惯用法(生成的宏消费 DTO),无需借用
needless_pass_by_value = "allow"
# 文档引用风格(引号/反引号)对注释不强制
doc_link_with_quotes = "allow"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
sled = "0.34"
base64 = "0.22"
once_cell = "1"
# 原生文件选择对话框（知识库导入）
rfd = "0.15"
# PDF 文本提取（知识库文档解析）
pdf-extract = "0.7"
# docx 解包（word/document.xml 文本提取）
zip = "2"
tauri-plugin-opener = "2.5.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# 健康度加固:release 启用 LTO + 单 codegen 单元 + strip 符号(减小体积)
lto = true
codegen-units = 1
strip = "symbols"
